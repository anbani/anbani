exclude: ^packages/rs/crates/anbani-core/src/generated/
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: end-of-file-fixer
        exclude: ^common/data/
        stages: [pre-commit]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^common/data/
        stages: [pre-commit]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        language: system
        entry: bash -c 'cd packages/rs && exec cargo fmt --all --check'
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy -D warnings
        language: system
        entry: bash -c 'cd packages/rs && exec cargo clippy --workspace --all-targets --all-features --locked -- -D warnings'
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-test
        name: cargo test (golden suite)
        language: system
        entry: bash -c 'cd packages/rs && exec cargo test --workspace --all-features --locked'
        files: ^(packages/rs/|common/spec/golden.*\.json)
        pass_filenames: false
        stages: [pre-push]
      - id: check-generated
        name: canonical data and package snapshots are current
        language: system
        entry: python3 packages/py/tools/gen.py --check
        pass_filenames: false
        always_run: true
