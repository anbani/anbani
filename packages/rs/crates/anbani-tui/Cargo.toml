[package]
name = "anbani-tui"
description = "anbani's terminal UI: tabs, command palette, which-key, live comparison matrix, linked inspector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
include = ["src/**", "LICENSE", "NOTICE"]

[dependencies]
anbani-core = { workspace = true, features = ["std", "legacy"] }
anbani-spell = { workspace = true }
crossterm = { version = "0.28", features = ["use-dev-tty"] }
fontdue = "0.9"
ratatui = "0.29"
serde_json = { workspace = true }

[lints]
workspace = true
